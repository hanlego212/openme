<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Another Chapter of Us</title>
  
  <!-- Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7d6e0;
      background-image: radial-gradient(#e5a9bc 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      font-family: 'VT323', monospace;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Player Status Bar */
    .header-players {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.75rem;
      color: #3b2a45;
      background-color: #d4f0d0; /* Soft Mint Accent */
      border: 3px solid #1a1a1a;
      padding: 10px 18px;
      box-shadow: 3px 3px 0px #1a1a1a;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Main Title */
    .main-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.6rem;
      color: #9e1b4d;
      text-align: center;
      margin-bottom: 12px;
      text-shadow: 2px 2px 0px #ffffff;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 1.4rem;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* Envelope Card Frame */
    .card-container {
      background-color: #fffdf9;
      border: 3px solid #1a1a1a;
      box-shadow: 6px 6px 0px #b8527a;
      width: 100%;
      max-width: 630px;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }

    .card-header-tag {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      color: #1a1a1a;
      background-color: #e1bee7; /* Soft Pastel Lavender */
      border: 2px solid #1a1a1a;
      padding: 8px 14px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
      box-shadow: 2px 2px 0px #1a1a1a;
    }
